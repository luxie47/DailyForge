<svg width="680" height="200" viewBox="0 0 680 200" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>DailyForge Banner</title>
  <desc>DailyForge prompt engineering skill banner for Claude, made by luxie47</desc>

  <!-- Background -->
  <rect width="680" height="200" rx="12" fill="#0f0f14"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="50" x2="680" y2="50" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.06"/>
  <line x1="0" y1="100" x2="680" y2="100" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.06"/>
  <line x1="0" y1="150" x2="680" y2="150" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.06"/>
  <line x1="170" y1="0" x2="170" y2="200" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.06"/>
  <line x1="340" y1="0" x2="340" y2="200" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.06"/>
  <line x1="510" y1="0" x2="510" y2="200" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.06"/>

  <!-- Accent glow circle left -->
  <circle cx="60" cy="100" r="80" fill="#7c3aed" fill-opacity="0.12"/>

  <!-- Lightning bolt icon -->
  <g transform="translate(44, 62)">
    <polygon points="20,0 8,22 16,22 0,44 24,18 15,18 28,0" fill="#a78bfa" opacity="0.95"/>
  </g>

  <!-- Main title -->
  <text x="92" y="108" font-family="system-ui, sans-serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-1">DailyForge</text>

  <!-- Tagline -->
  <text x="92" y="134" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#a1a1aa" letter-spacing="0.5">Prompt engineering skill for Claude</text>

  <!-- Divider -->
  <line x1="92" y1="145" x2="500" y2="145" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.12"/>

  <!-- Feature pills -->
  <rect x="92" y="156" width="68" height="22" rx="11" fill="#7c3aed" fill-opacity="0.25"/>
  <text x="126" y="171" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#c4b5fd" text-anchor="middle">/dailyforge</text>

  <rect x="168" y="156" width="52" height="22" rx="11" fill="#0e7490" fill-opacity="0.25"/>
  <text x="194" y="171" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#67e8f9" text-anchor="middle">debug</text>

  <rect x="228" y="156" width="62" height="22" rx="11" fill="#065f46" fill-opacity="0.3"/>
  <text x="259" y="171" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#6ee7b7" text-anchor="middle">translate</text>

  <rect x="298" y="156" width="57" height="22" rx="11" fill="#92400e" fill-opacity="0.3"/>
  <text x="326" y="171" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#fcd34d" text-anchor="middle">compare</text>

  <rect x="363" y="156" width="42" height="22" rx="11" fill="#831843" fill-opacity="0.3"/>
  <text x="384" y="171" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#f9a8d4" text-anchor="middle">score</text>

  <!-- Right side credit -->
  <text x="648" y="176" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#52525b" text-anchor="end">by luxie47</text>

  <!-- Right decorative accent -->
  <circle cx="630" cy="60" r="50" fill="#7c3aed" fill-opacity="0.07"/>
  <circle cx="650" cy="40" r="25" fill="#a78bfa" fill-opacity="0.08"/>
</svg>
